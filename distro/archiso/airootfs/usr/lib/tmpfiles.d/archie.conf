# ArchieOS runtime paths.
#
# `archied` runs as User=archie/Group=archie (see archied.service), so every path it
# must read or write has to be reachable by that group. sysusers.d allocates the archie
# user at first boot, which is why ownership cannot be baked into the ISO with
# profiledef.sh `file_permissions` — the GID does not exist at image build time.
# systemd-sysusers.service is ordered Before= systemd-tmpfiles-setup.service, so the
# account exists by the time these lines are applied.

d /var/lib/archie 0750 archie archie -
d /var/log/archie 0750 archie archie -
d /run/archie 0750 archie archie -

# The configuration directory stays root-owned: the daemon reads its policy, it does not
# rewrite it. Group `archie` gets traverse access only.
z /etc/archie 0750 root archie -

# The config FILE needs its own line. `z` adjusts exactly one path and is not recursive,
# so fixing the directory above leaves this file at its image ownership (root:root 0640),
# where group `archie` falls through to "other" and gets nothing. That is precisely the
# EACCES that stopped archied from booting the 0.1.0 ISO: the daemon started, failed to
# read its own config, exited 78 (EX_CONFIG), and RestartPreventExitStatus kept it down,
# so the image never reached ARCHIE READY. Keep this line and its directory line in step.
z /etc/archie/archie.toml 0640 root archie -
