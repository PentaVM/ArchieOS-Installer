# Type Name ID GECOS Home Shell
u archie - "ArchieOS control plane" /var/lib/archie /usr/bin/nologin

# The execution supervisor's account.
#
# Separate from `archie` on purpose. This process can create cgroups and spawn workers;
# it must not be able to read the node's private key or open archied's control socket.
# It is in the `archie` group so the two can share a socket by filesystem permission,
# which is the whole of the authentication between them.
u archie-executor - "ArchieOS execution supervisor" /var/lib/archie-executor /usr/bin/nologin
m archie-executor archie
