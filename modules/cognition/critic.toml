# Adversarial review: contradiction search and assumption attack.
#
# Deliberately separate from the researcher. A module that both proposes and approves its
# own conclusions is not a check on anything.
id = "cognition.critic"
version = "0.1.0"
description = "Adversarial review, contradiction search, assumption attack"
priority = 120

required_capabilities = ["compute.inference"]
dependencies = ["core.memory"]
permissions = ["read-knowledge"]

[worker]
kind = "python"
module = "workers.critic"
entrypoint = "main"

[health_check]
kind = "heartbeat"
interval_seconds = 60
