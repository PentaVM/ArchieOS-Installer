# ADS-B ingestion and military/ISR classification.
#
# Coverage is uneven by nature: ADS-B is sparse over open ocean and state aircraft
# routinely disable transponders. The provider manifest records those gaps so an empty
# region is read as "not observed" rather than "nothing there".
id = "sentry.aviation"
version = "0.1.0"
description = "ADS-B track ingestion, aircraft classification, airlift pattern observation"
priority = 400

required_capabilities = ["world.aviation", "network.internet"]
optional_capabilities = ["fusion.entity-resolution"]
dependencies = ["core.sentry"]
permissions = ["read-knowledge", "write-knowledge", "network-internet"]

[worker]
kind = "unimplemented"
reason = "No native implementation yet. The Python worker this named never existed, and ArchieOS ships no Python runtime."

[health_check]
kind = "heartbeat"
interval_seconds = 60
