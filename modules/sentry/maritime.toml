# AIS ingestion and chokepoint transit observation.
id = "sentry.maritime"
version = "0.1.0"
description = "AIS vessel tracks, port calls, and chokepoint transit rates"
priority = 400

required_capabilities = ["world.maritime", "network.internet"]
dependencies = ["core.sentry"]
permissions = ["read-knowledge", "write-knowledge", "network-internet"]

[worker]
kind = "python"
module = "workers.sentry.maritime"
entrypoint = "main"

[health_check]
kind = "heartbeat"
interval_seconds = 60
