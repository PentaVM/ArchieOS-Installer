# TLE propagation, pass prediction, and space weather.
id = "sentry.orbital"
version = "0.1.0"
description = "Satellite element sets, pass prediction, and space weather indices"
priority = 410

required_capabilities = ["world.orbital", "network.internet"]
optional_capabilities = ["world.spaceweather"]
dependencies = ["core.sentry"]
permissions = ["read-knowledge", "write-knowledge", "network-internet"]

[worker]
kind = "unimplemented"
reason = "No native implementation yet. The Python worker this named never existed, and ArchieOS ships no Python runtime."

[health_check]
kind = "heartbeat"
interval_seconds = 300
