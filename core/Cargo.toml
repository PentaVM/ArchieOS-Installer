# ArchieOS control plane — Cargo workspace.
#
# The workspace contains the trusted Rust control plane plus two deliberately
# unprivileged display projection crates. Only `archie-core` and its authority
# dependencies may hold identity keys or make policy/scheduler decisions.
# `archie-displayd` is read-only and `archie-worldd` has no Archie state access.

[workspace]
resolver = "2"
members = [
    "crates/archie-types",
    "crates/archie-observability",
    "crates/archie-state",
    "crates/archie-postgres",
    "crates/archie-policy",
    "crates/archie-registry",
    "crates/archie-fabric",
    "crates/archie-scheduler",
    "crates/archie-execution",
    "crates/archie-executord",
    "crates/archie-task-runner",
    "crates/archie-router",
    "crates/archie-memory",
    "crates/archie-core",
    "crates/archie-displayd",
    "crates/archie-worldd",
    "crates/archied",
    "crates/archie-cli",
    "crates/archie-installer",
    "crates/archie-speech",
    "crates/archie-geofabric",
    "crates/archie-model-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Proprietary"
repository = "https://github.com/PentaVM/ArchieOS-Nvidia"

[workspace.dependencies]
# Internal crates.
archie-types = { path = "crates/archie-types" }
archie-observability = { path = "crates/archie-observability" }
archie-state = { path = "crates/archie-state" }
archie-postgres = { path = "crates/archie-postgres" }
archie-policy = { path = "crates/archie-policy" }
archie-registry = { path = "crates/archie-registry" }
archie-fabric = { path = "crates/archie-fabric" }
archie-scheduler = { path = "crates/archie-scheduler" }
archie-execution = { path = "crates/archie-execution" }
archie-executord = { path = "crates/archie-executord" }
archie-task-runner = { path = "crates/archie-task-runner" }
archie-router = { path = "crates/archie-router" }
archie-memory = { path = "crates/archie-memory" }
archie-core = { path = "crates/archie-core" }
archie-installer = { path = "crates/archie-installer" }
archie-speech = { path = "crates/archie-speech" }
archie-geofabric = { path = "crates/archie-geofabric" }
archie-displayd = { path = "crates/archie-displayd" }
archie-worldd = { path = "crates/archie-worldd", default-features = false }
archie-model-runtime = { path = "crates/archie-model-runtime" }

# External.
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
postgres = "=0.19.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
