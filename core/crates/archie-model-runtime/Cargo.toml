[package]
name = "archie-model-runtime"
description = "Provider-neutral, policy-gated inference transport for ArchieOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "archie-infer"
path = "src/main.rs"

[[bin]]
name = "archie-ask"
path = "src/bin/archie-ask.rs"

[dependencies]
archie-types.workspace = true
archie-registry.workspace = true
archie-router.workspace = true
archie-vault.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
