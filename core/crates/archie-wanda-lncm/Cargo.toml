[package]
name = "archie-wanda-lncm"
description = "Wanda's LNCM: a small next-concept expert that reads social context in chunks, keeps what to expect of each person, and answers in two states."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Train and run on an NVIDIA GPU. Needs the CUDA toolkit at build time.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
archie-model-runtime.workspace = true
archie-registry.workspace = true
archie-types.workspace = true
archie-vault.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
clap.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["json"] }
tempfile = "3"
