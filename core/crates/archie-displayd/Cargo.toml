[package]
name = "archie-displayd"
description = "Unprivileged read-only bridge feeding the ArchieOS observatory display."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "archie_displayd"
path = "src/lib.rs"

[[bin]]
name = "archie-displayd"
path = "src/main.rs"

[dependencies]
archie-core.workspace = true
archie-geofabric.workspace = true
archie-observability.workspace = true
archie-orb.workspace = true
archie-state.workspace = true
archie-types.workspace = true
archie-worldd = { workspace = true, default-features = false }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
