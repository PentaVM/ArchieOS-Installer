[package]
name = "archie-desk"
description = "The person's end of Archie's delivery stream: results a node produced land in a folder on the workstation, in the formats the person's own software opens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
archie-bridges.workspace = true
axum.workspace = true
futures-util.workspace = true
hex.workspace = true
ring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util"] }
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util"] }
