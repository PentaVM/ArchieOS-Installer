[package]
name = "archie-search"
description = "Web search entered through the capability model: provider manifests, the admission gate every query passes, and a bounded Tavily client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "archie-search"
path = "src/main.rs"

[dependencies]
archie-types.workspace = true
archie-vault.workspace = true
clap.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
