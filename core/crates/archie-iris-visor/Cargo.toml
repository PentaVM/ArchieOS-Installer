[package]
name = "archie-iris-visor"
description = "What Archie sees: a camera through IRIS, live, and the text it reads going to Wanda, in an ArchieOS window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
jpeg-decoder.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
