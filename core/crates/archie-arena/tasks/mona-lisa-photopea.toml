# Copy a painting in Photopea, a Photoshop-like editor, with the mouse and keyboard alone.
# What it measures: finding and working the tools (brush, its size, colours), and precision
# of the hand — choosing and changing brush and colour as a painter does, under a time limit.
# Changing the painting is changing `reference`; nothing else here knows it is the Mona Lisa.
id = "mona-lisa-photopea"
app_id = "firefox"
reference = "mona-lisa.png"   # Wikimedia Commons, C2RMF scan, public domain; 384x572
judge = "picture"
tiers = [15, 60, 300]
prompt = """Photopea, a Photoshop-like image editor, is open with a new white document. \
Paint a copy of the reference picture on that white document, as close to it as you can: \
same composition, shapes and colours. Use Photopea's tools as a painter would: pick the \
brush, change its size, change the colour as often as the picture needs, and paint with \
strokes. Paint only inside the white document."""
