[package]
name = "archie-lan"
description = "Sentry's sense of the local network: which devices are on the owner's LAN, what they are, and what the ones that say so are doing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "archie-lan"
path = "src/main.rs"

[[bin]]
name = "archie-netwatch"
path = "src/bin/archie-netwatch.rs"

[dependencies]
archie-types.workspace = true
# The IEEE OUI registry, embedded at build time (MIT): who made a network card.
oui-data = "0.2.3"
serde.workspace = true
serde_json.workspace = true
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.13"
roxmltree = "0.20"
uuid.workspace = true
clap.workspace = true
fs2.workspace = true
mdns-sd = { version = "=0.21.5", default-features = false }

[dev-dependencies]
mdns-sd = { version = "=0.21.5", default-features = false, features = ["serde"] }
